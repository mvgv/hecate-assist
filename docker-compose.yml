services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/Modelfile:/Modelfile:ro
      # GGUF montado tambem aqui: p/ modelos grandes (8B ~4.9 GB) o `ollama create`
      # roda DENTRO deste container (copia em disco, mmap) em vez de via `model-init`
      # (que faz POST HTTP do blob e estoura a RAM da VM WSL2 de ~8 GB).
      - ./models:/models:ro
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # 2: o grafo mantem 2 modelos carregados ao mesmo tempo — o `medassist` 8B
      # (gerar_resposta) na GPU e o `llama3.2:3b` (triagem) na CPU (num_gpu=0, ver
      # config.py). Com 1, o Ollama descarregaria o 8B a cada chamada de triagem
      # (~+60-90 s/ask). Como o 3B fica na CPU, nao ha disputa de VRAM: `ollama ps`
      # deve mostrar `medassist` = 100% GPU e `llama3.2:3b` = 100% CPU.
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=-1
    # 8B Q4_K_M ~4.9 GB de pesos; folga p/ KV cache + runner (na GPU o peso vai
    # p/ VRAM, mas o load path ainda usa RAM de host; no CPU-only precisa de tudo).
    mem_limit: 10g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./deploy:/deploy:ro
      - ./models:/models:ro
    # cria o `medassist` (fine-tunado) e baixa o modelo auxiliar geral usado na
    # triagem e no verificador dos guardrails (get_llm(aux=True) -> model_aux).
    entrypoint:
      - sh
      - -c
      - "ollama create medassist -f /deploy/Modelfile && ollama pull llama3.2:3b"
    restart: "no"
    profiles: ["full"]

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - MEDASSIST_LLM_PROVIDER=ollama
      - MEDASSIST_MODEL=medassist
      - MEDASSIST_MODEL_AUX=llama3.2:3b
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    mem_limit: 4g
    restart: unless-stopped
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    profiles: ["full"]

volumes:
  ollama_models: {}
  app_data: {}
  app_logs: {}
  caddy_data: {}
