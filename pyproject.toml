[project]
name = "medassist"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "structlog>=24.0",
  "streamlit>=1.38",
  "typer>=0.12",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "requests>=2.32",
]

[project.optional-dependencies]
train = ["datasets", "peft", "trl", "bitsandbytes", "unsloth"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "rouge-score"]

[project.scripts]
medassist = "medassist.ui.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medassist = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# BLE001/S110/DTZ011/SIM114 fogem do escopo pragmatico deste projeto (o
# proprio §11 da especificacao pede captura ampla de excecao nos nos do
# grafo para nunca deixar o usuario sem resposta).
